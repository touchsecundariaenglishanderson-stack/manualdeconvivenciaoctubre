  }else{labels=YEARS;
   STUDENTS.forEach((s,j)=>sets.push(mk(short(s.name),YEARS.map(y=>s.years[y]?s.years[y].t[k][m]:null),COL[j%COL.length])));
   sets.push(av(ml,YEARS.map(y=>{const v=STUDENTS.filter(s=>s.years[y]).map(s=>s.years[y].t[k][m]);return v.length?Math.round(avg(v)*10)/10:null}),"#64748b",true));
  }}
 chart=new Chart($("ch"),{type:t,data:{labels,datasets:sets},
  options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:tx}}},
  scales:t==="radar"?{r:{min:0,max:100,ticks:{color:tx,backdropColor:"transparent"},grid:{color:gr},pointLabels:{color:tx}}}:{y:{min:0,max:100,ticks:{color:tx},grid:{color:gr}},x:{ticks:{color:tx},grid:{display:false}}}}});
}
function pct(p){return `<div class="track"><div class="fill" style="width:${p}%"></div></div><div class="ticks">${[0,20,40,60,80,100].map(n=>`<span>${n}</span>`).join("")}</div>`}
function bottom(L,S,Y){
 const yr=YEARS[yi];
 const none=`<p class="t">Año ${yr}</p><div style="color:var(--mu)">Sin datos cargados para este año.</div>`;
 if(!L.length||(si>=0&&!Y)){$("b1").innerHTML=none;$("b2").innerHTML=none;return}
 const idx=s=>STUDENTS.indexOf(s);
 const bar=(a,b,w)=>`<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:14px"><span>${a}</span><b>${b}</b></div><div class="track"><div class="fill" style="width:${w}%"></div></div></div>`;
 if(si<0){
  const by=f=>L.slice().sort((a,b)=>(f(b)??-1)-(f(a)??-1));
  if(k==="res"){
   const rows=by(s=>s.years[yr].g).map((s,r)=>{const y=s.years[yr];return `<tr data-i="${idx(s)}" style="cursor:pointer" title="Ver detalle"><td>${r+1}. ${short(s.name)}</td>${KS.map(i=>`<td>${nz(y.t[i].s)}</td>`).join("")}<td><b>${y.g}</b></td><td>${y.pg==null?"—":y.pg+"%"}</td></tr>`}).join("");
   const av=`<tr><td><b>Promedio</b></td>${KS.map(i=>`<td><b>${avg(L.map(s=>s.years[yr].t[i].s)).toFixed(1)}</b></td>`).join("")}<td><b>${Math.round(avg(L.map(s=>s.years[yr].g)))}</b></td><td><b>${Math.round(avg(L.map(s=>s.years[yr].pg)))}%</b></td></tr>`;
   $("b1").innerHTML=`<p class="t">Matriz de resultados · ${yr}</p><div style="overflow-x:auto"><table><tr><th>Estudiante</th><th>Lec</th><th>Mat</th><th>Soc</th><th>Nat</th><th>Ing</th><th>Global</th><th>Perc.</th></tr>${rows}${av}</table></div><div class="note">Haz clic en un estudiante para ver su detalle.</div>`;
   $("b2").innerHTML=`<p class="t">Ranking · puntaje global</p>`+by(s=>s.years[yr].g).map(s=>bar(short(s.name),s.years[yr].g,s.years[yr].g/5)).join("");
  }else{
   const rows=by(s=>s.years[yr].t[k].s).map((s,r)=>{const y=s.years[yr].t[k];return `<tr data-i="${idx(s)}" style="cursor:pointer" title="Ver detalle"><td>${r+1}. ${short(s.name)}</td><td><b>${nz(y.s)}</b></td><td>${y.p==null?"—":y.p+"%"}</td><td>${nz(y.l)}</td></tr>`}).join("");
   $("b1").innerHTML=`<p class="t">${T[k].n} · ${yr}</p><table><tr><th>Estudiante</th><th>Puntaje</th><th>Percentil</th><th>Nivel</th></tr>${rows}<tr><td><b>Promedio</b></td><td><b>${avg(L.map(s=>s.years[yr].t[k].s)).toFixed(1)}</b></td><td><b>${Math.round(avg(L.map(s=>s.years[yr].t[k].p)))}%</b></td><td></td></tr></table><div class="note">Haz clic en un estudiante para ver su detalle.</div>`;
   const lv=T[k].lv;
   $("b2").innerHTML=`<p class="t">Estudiantes por nivel</p>`+lv.map(l=>{const n=L.filter(s=>s.years[yr].t[k].l===l);return bar("Nivel "+l+(n.length?` <small style="color:var(--mu)">· ${n.map(s=>short(s.name).split(" ")[0]).join(", ")}</small>`:""),n.length,n.length/(L.filter(s=>s.years[yr].t[k].l!=null).length||1)*100)}).join("");
  }
  return;
 }
 const ref=Y.ref;
 if(k==="res"){
  const ing=Y.t.ing.s!=null;let sum=0;
  const rows=KS.filter(i=>i!=="ing"||ing).map(i=>{const w=ing?T[i].w:1,r=Y.t[i].s*w;sum+=r;return `<tr><td>${T[i].n}</td><td>${Y.t[i].s}</td><td>× ${w}</td><td><b>${r}</b></td></tr>`}).join("");
  const den=ing?13:4,av=sum/den;
  $("b1").innerHTML=`<p class="t">Cálculo del puntaje global</p><div style="overflow-x:auto"><table><tr><th>Prueba</th><th>Puntaje</th><th>Pond.</th><th>Resultado</th></tr>${rows}</table></div><div class="note">Suma ${sum} ÷ ${den} = <b>${av.toFixed(2)}</b> → × 5 = <b>${Math.round(av*5)}</b> puntos (global).${ing?"":" Sin Inglés: promedio simple de las 4 pruebas."}</div>`;
  $("b2").innerHTML=Y.pg!=null?`<p class="t">Percentil global</p><div class="big" style="margin-bottom:10px">${Y.pg}<small> %</small></div>${pct(Y.pg)}<div class="note">Superó al ${Y.pg} % de los estudiantes a nivel nacional.</div>`:`<p class="t">Percentil global · grupo de referencia</p><div class="big" style="margin-bottom:10px">${ref.g}<small> %</small></div>${pct(ref.g)}<div class="note">Superó al ${ref.g} % de los estudiantes con discapacidad que presentaron cuadernillo con ajustes sin inglés.</div>`;
 }else{
  const r=Y.t[k];
  if(r.s==null){const m=`<p class="t">${T[k].n}</p><div style="color:var(--mu)">No presentó esta prueba (cuadernillo con ajustes sin inglés).</div>`;$("b1").innerHTML=m;$("b2").innerHTML=m;return}
  const lv=T[k].lv,ix=lv.indexOf(r.l);
  const lad=lv.map((l,i)=>`<div class="col ${i<=ix?"on":""} ${i===ix?"cur":""}">${i===ix?"▼":""}<b>${l}</b>${Array.from({length:i+1},()=>"<i></i>").join("")}</div>`).join("");
  const sk=SK[k][r.l]||[];
  $("b1").innerHTML=`<p class="t">Nivel de desempeño · <span class="pill">${r.l}</span></p><div class="lad">${lad}</div><p class="t" style="margin-top:14px">¿Qué habilidades reflejan este nivel?</p><ul class="sk">${sk.map(x=>`<li>${x}</li>`).join("")}</ul>`;
  $("b2").innerHTML=`<p class="t">Percentil · estudiantes a nivel nacional</p><div class="big" style="margin-bottom:10px">${r.p}<small> %</small></div>${pct(r.p)}<div class="note">Superó al ${r.p} % de los estudiantes del país en ${T[k].n}.</div>`+(ref?`<p class="t" style="margin-top:14px">Percentil · estudiantes con discapacidad</p><div class="big" style="margin-bottom:10px">${ref[k]}<small> %</small></div>${pct(ref[k])}<div class="note">Frente a quienes presentaron cuadernillo con ajustes sin inglés.</div>`:"");
 }
}
render();
</script></body></html>
